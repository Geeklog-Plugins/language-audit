name: Language Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run language audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEEKLOG_ORG: Geeklog-Plugins
        run: python3 audit.py

      - name: Commit report when changed
        run: |
          if git diff --quiet REPORT.md; then
            echo "No report changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPORT.md
          git commit -m "Update language audit report"
          git push
